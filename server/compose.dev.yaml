# Requires Docker Compose 2.24.4+ for !override. Infrastructure stays in Docker.
services:
  core:
    profiles: [container-core]
  worker:
    profiles: [container-core]
  gateway:
    depends_on: !override [logto, hasura, centrifugo]
    extra_hosts: [host.docker.internal:host-gateway]
    volumes: !override
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./generated/apisix.dev.yaml:/usr/local/apisix/conf/apisix.yaml:ro
  db:
    ports: ['127.0.0.1:5432:5432']
  hasura:
    environment:
      HASURA_GRAPHQL_AUTH_HOOK: http://host.docker.internal:4000/internal/hasura-auth
    extra_hosts: [host.docker.internal:host-gateway]
    ports: ['127.0.0.1:8081:8080']
  minio:
    ports: ['127.0.0.1:9000:9000']
  centrifugo:
    ports: ['127.0.0.1:8000:8000']
  n8n:
    extra_hosts: [host.docker.internal:host-gateway]
    ports: ['127.0.0.1:5678:5678']
  logto:
    ports: ['127.0.0.1:3001:3001']
  web:
    profiles: [container-web]
