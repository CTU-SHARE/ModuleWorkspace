name: sharebase
x-core-env: &core-env
  DATABASE_URL: postgres://sharebase:${CORE_DB_PASSWORD}@db:5432/sharebase
  LOGTO_ISSUER: ${AUTH_ORIGIN}/oidc
  LOGTO_JWKS_URL: http://logto:3001/oidc/jwks
  LOGTO_RESOURCE: ${LOGTO_RESOURCE}
  INTERNAL_SECRET: ${INTERNAL_SECRET}
  CENTRIFUGO_SECRET: ${CENTRIFUGO_SECRET}
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
  CENTRIFUGO_URL: http://centrifugo:8000
  N8N_WEBHOOK_URL: http://n8n:5678/webhook/${WORKFLOW_PATH}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: sharebase
  HASURA_URL: http://hasura:8080
  HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
  MIGRATIONS_DIR: /migrations
  METADATA_FILE: /metadata/metadata.json
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD}
      LOGTO_DB_PASSWORD: ${LOGTO_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-users.sh:ro
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./core
    environment: *core-env
    command: [node, dist/migrate.js]
    volumes: [./db/migrations:/migrations:ro]
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
  logto-init:
    image: ${LOGTO_IMAGE}
    entrypoint: [sh, -c]
    command: ['npm run cli db seed -- --swe']
    environment:
      DB_URL: postgres://logto:${LOGTO_DB_PASSWORD}@db:5432/logto
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
  logto:
    image: ${LOGTO_IMAGE}
    entrypoint: [sh, -c]
    command: ['npm run cli db seed -- --swe && npm start']
    environment:
      DB_URL: postgres://logto:${LOGTO_DB_PASSWORD}@db:5432/logto
      ENDPOINT: ${AUTH_ORIGIN}
      ADMIN_ENDPOINT: http://localhost:3002
      TRUST_PROXY_HEADER: '1'
    networks: [internal]
    depends_on:
      logto-init: { condition: service_completed_successfully }
    restart: unless-stopped
  core:
    build: ./core
    environment: *core-env
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    build: ./core
    command: [node, dist/worker.js]
    environment: *core-env
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  hasura:
    image: hasura/graphql-engine:v2.48.0
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@db:5432/hasura
      HASURA_DATA_DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@db:5432/sharebase
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'false'
      HASURA_GRAPHQL_DEV_MODE: 'false'
      HASURA_GRAPHQL_AUTH_HOOK: http://core:4000/internal/hasura-auth
      HASURA_GRAPHQL_AUTH_HOOK_MODE: POST
      HASURA_GRAPHQL_ENABLED_APIS: graphql,metadata
      HASURA_GRAPHQL_CORS_DOMAIN: ${PUBLIC_ORIGIN}
      HASURA_GRAPHQL_WS_READ_COOKIE: 'false'
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  metadata:
    build: ./core
    command: [node, dist/metadata.js]
    environment: *core-env
    volumes: [./hasura:/metadata:ro]
    networks: [internal]
    depends_on: [hasura]
    profiles: [setup]
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: 'off'
    volumes: [minio-data:/data]
    networks: [internal]
    restart: unless-stopped
  minio-init:
    image: ${MINIO_MC_IMAGE}
    entrypoint: [/bin/sh, /init.sh]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [./minio/init.sh:/init.sh:ro]
    networks: [internal]
    depends_on: [minio]
  n8n:
    image: ${N8N_IMAGE}
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_SECURE_COOKIE: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
    volumes: [n8n-data:/home/node/.n8n, ./generated/n8n:/imports:ro]
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  centrifugo:
    image: centrifugo/centrifugo:v6.1.0
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
    volumes: [./generated/centrifugo.json:/centrifugo/config.json:ro]
    networks: [internal]
    restart: unless-stopped
  web:
    build: ../web
    volumes: [./generated/config.json:/usr/share/nginx/html/config.json:ro]
    networks: [internal]
    restart: unless-stopped
  backup-objects:
    image: alpine:3.21
    profiles: [backup]
    volumes: [minio-data:/data:ro, ./backups:/backup]
    networks: [internal]
    entrypoint: [tar]
  gateway:
    image: apache/apisix:3.12.0-debian
    ports: ['${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:9080']
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./generated/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks: [edge, internal]
    depends_on: [core, web, logto, hasura, centrifugo]
    restart: unless-stopped
networks:
  internal: { internal: true }
  edge: {}
volumes:
  db-data:
  minio-data:
  n8n-data:
